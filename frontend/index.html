<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lenny Growth Assistant</title>
    <!-- Modern Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --bg-chat-user: #4f46e5;
            --bg-chat-assistant: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-purple: #6366f1;
            --accent-hover: #4338ca;
            --border-color: #334155;
            --artifact-bg: #090d16;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- LEFT SIDEBAR --- */
        #sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
            flex-shrink: 0;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
        }

        .brand-header i {
            color: var(--accent-purple);
            font-size: 1.4rem;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, var(--accent-purple), #818cf8);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .session-item {
            padding: 0.65rem 0.75rem;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            transition: all 0.15s ease;
        }

        .session-title-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .delete-session-btn {
            color: #ef4444;
            opacity: 0.4;
            transition: opacity 0.2s ease;
            padding: 2px 6px;
        }

        .delete-session-btn:hover {
            opacity: 1;
        }

        .session-item:hover, .session-item.active {
            background-color: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            color: var(--text-main);
        }

        /* --- MAIN CHAT AREA --- */
        #main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .message-bubble {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble.user {
            align-self: flex-end;
            background-color: var(--bg-chat-user);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message-bubble.assistant {
            align-self: flex-start;
            background-color: var(--bg-chat-assistant);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .artifact-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(99, 102, 241, 0.25);
            border: 1px solid rgba(99, 102, 241, 0.6);
            color: #a5b4fc;
            padding: 0.6rem 0.85rem;
            border-radius: 8px;
            margin-top: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .artifact-badge:hover {
            background: rgba(99, 102, 241, 0.45);
            transform: translateY(-1px);
        }

        /* --- INPUT BAR --- */
        .input-container {
            padding: 1.25rem 1.5rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            display: flex;
            gap: 0.75rem;
        }

        .input-container textarea {
            flex: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            color: white;
            font-size: 0.95rem;
            resize: none;
            height: 52px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-container textarea:focus {
            border-color: var(--accent-purple);
        }

        .send-btn {
            background-color: var(--accent-purple);
            color: white;
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
        }

        /* --- RIGHT ARTIFACT PANEL (SPLIT SCREEN) --- */
        #artifact-panel {
            width: 550px;
            background-color: var(--artifact-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(100%);
            position: absolute;
            right: 0;
            top: 0;
            z-index: 10;
        }

        #artifact-panel.open {
            transform: translateX(0);
            position: relative;
        }

        .artifact-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-sidebar);
        }

        .artifact-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #a5b4fc;
        }

        .toggle-group {
            display: flex;
            background-color: var(--bg-dark);
            padding: 2px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background-color: var(--accent-purple);
            color: white;
        }

        .close-artifact-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.25rem;
        }

        .close-artifact-btn:hover {
            color: white;
        }

        .artifact-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .artifact-content pre {
            background-color: #1e293b;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 0.9rem;
            color: #38bdf8;
            white-space: pre-wrap;
        }

        .artifact-iframe {
            width: 100%;
            height: 100%;
            min-height: 450px;
            border: none;
            background: #ffffff;
            border-radius: 8px;
        }

        .artifact-content h1, .artifact-content h2, .artifact-content h3 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .artifact-content ul, .artifact-content ol {
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .artifact-content p {
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR -->
    <div id="sidebar">
        <div class="brand-header">
            <i class="fa-solid fa-brain"></i>
            <span>Lenny Growth AI</span>
        </div>
        
        <button class="new-chat-btn" onclick="createNewChat()">
            <i class="fa-solid fa-plus"></i> New Chat
        </button>

        <div class="sessions-list" id="sessions-list">
            <!-- Dynamically populated from /sessions -->
        </div>
    </div>

    <!-- CENTER CHAT AREA -->
    <div id="main-chat">
        <div class="chat-header">
            <h2 id="current-chat-title">New Chat</h2>
            <div style="font-size: 0.85rem; color: var(--text-muted);">
                <i class="fa-solid fa-database" style="color: #10b981;"></i> Supabase pgvector Connected
            </div>
        </div>

        <div class="messages-container" id="messages-container">
            <div class="message-bubble assistant">
                👋 Hello! I am <strong>The Lenny Growth Assistant</strong>. Ask me anything about Lenny's Podcast transcripts, product growth, or ask me to generate a <strong>Ship30for30 essay</strong>, <strong>.md file</strong>, or <strong>HTML component code</strong>!
            </div>
        </div>

        <div class="input-container">
            <textarea id="user-input" placeholder="Ask a question or request an article/guide/file/HTML..." onkeydown="handleKeyPress(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- RIGHT ARTIFACT PANEL (SPLIT SCREEN) -->
    <div id="artifact-panel">
        <div class="artifact-header">
            <h3 id="artifact-title-text"><i class="fa-solid fa-file-code"></i> Artifact Viewer</h3>
            
            <div class="toggle-group">
                <button class="toggle-btn active" id="btn-preview" onclick="switchArtifactTab('preview')">Preview</button>
                <button class="toggle-btn" id="btn-code" onclick="switchArtifactTab('code')">Code</button>
            </div>

            <button class="close-artifact-btn" onclick="closeArtifactPanel()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="artifact-content" id="artifact-body">
            <!-- Rendered Markdown or Live HTML iframe goes here -->
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let currentSessionId = null;
        let currentArtifactRaw = "";
        let currentArtifactTitle = "";

        // --- ON PAGE LOAD ---
        window.addEventListener('DOMContentLoaded', () => {
            loadSessions();
        });

        // --- FETCH SESSIONS SIDEBAR ---
        async function loadSessions() {
            try {
                const res = await fetch(`${API_BASE}/sessions`);
                const data = await res.json();
                const container = document.getElementById('sessions-list');
                container.innerHTML = '';

                data.sessions.forEach(sess => {
                    const item = document.createElement('div');
                    item.className = `session-item ${sess.id === currentSessionId ? 'active' : ''}`;
                    item.innerHTML = `
                        <div class="session-title-wrap" onclick="selectSession('${sess.id}', '${escapeHtml(sess.title)}')">
                            <i class="fa-regular fa-message"></i> ${escapeHtml(sess.title)}
                        </div>
                        <i class="fa-solid fa-trash-can delete-session-btn" onclick="deleteSession(event, '${sess.id}')" title="Delete Chat"></i>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error("Error loading sessions:", err);
            }
        }

        // --- DELETE SESSION ---
        async function deleteSession(event, sessionId) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to delete this chat thread?")) return;
            try {
                await fetch(`${API_BASE}/sessions/${sessionId}`, { method: 'DELETE' });
                if (currentSessionId === sessionId) {
                    createNewChat();
                } else {
                    loadSessions();
                }
            } catch (err) {
                console.error("Error deleting session:", err);
            }
        }

        // --- CREATE NEW CHAT ---
        async function createNewChat() {
            try {
                const res = await fetch(`${API_BASE}/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: 'New Chat' })
                });
                const data = await res.json();
                currentSessionId = data.session_id;
                document.getElementById('current-chat-title').innerText = 'New Chat';
                
                // Clear chat messages window
                const container = document.getElementById('messages-container');
                container.innerHTML = `
                    <div class="message-bubble assistant">
                        👋 Started a new session! Ask me anything about Lenny's Podcast or request an actionable guide or HTML snippet.
                    </div>
                `;
                
                closeArtifactPanel();
                loadSessions();
            } catch (err) {
                console.error("Error creating session:", err);
            }
        }

        // --- SELECT SESSION FROM SIDEBAR ---
        async function selectSession(sessionId, title) {
            currentSessionId = sessionId;
            document.getElementById('current-chat-title').innerText = title;
            closeArtifactPanel();
            loadSessions();

            // Load past messages
            try {
                const res = await fetch(`${API_BASE}/sessions/${sessionId}/messages`);
                const data = await res.json();
                const container = document.getElementById('messages-container');
                container.innerHTML = '';

                data.messages.forEach(msg => {
                    appendMessageBubble(msg.role, msg.content);
                });
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error("Error loading messages:", err);
            }
        }

        // --- SEND CHAT MESSAGE ---
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;

            // Render user bubble immediately
            appendMessageBubble('user', query);
            input.value = '';

            // Show typing indicator bubble
            const typingBubble = appendMessageBubble('assistant', 'Thinking and retrieving from Supabase vector DB...');

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query, session_id: currentSessionId })
                });
                const data = await res.json();
                
                // Save returned session_id if new
                if (!currentSessionId) {
                    currentSessionId = data.session_id;
                }
                
                // Remove typing bubble and append real assistant bubble
                typingBubble.remove();
                appendMessageBubble('assistant', data.response);
                
                // Refresh sessions sidebar title
                loadSessions();
            } catch (err) {
                typingBubble.innerText = "Error connecting to server. Please ensure Uvicorn backend is running!";
                console.error("Chat error:", err);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // --- APPEND MESSAGE BUBBLE & BULLETPROOF ARTIFACT PARSER ---
        function appendMessageBubble(role, content) {
            const container = document.getElementById('messages-container');
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${role}`;

            if (role === 'assistant') {
                // Flexible regex parser for <artifact> tag variations
                let artifactMatch = content.match(/<artifact[\s\S]*?title="([^"]+)"[\s\S]*?>([\s\S]*?)<\/artifact>/i);
                if (!artifactMatch) {
                    artifactMatch = content.match(/<artifact[\s\S]*?>([\s\S]*?)<\/artifact>/i);
                }

                if (artifactMatch) {
                    const artifactTitle = artifactMatch[1] || "Lenny Growth Document";
                    const artifactBody = (artifactMatch[2] || artifactMatch[1] || "").trim();

                    // Text outside the tag
                    const textOutside = content.replace(/<artifact[\s\S]*?<\/artifact>/gi, '').trim();
                    bubble.innerHTML = marked.parse(textOutside || "Generated an artifact document for you:");

                    // Add click badge to open Artifact Panel
                    const badge = document.createElement('div');
                    badge.className = 'artifact-badge';
                    badge.innerHTML = `<i class="fa-solid fa-file-lines"></i> Open Artifact: <strong>${escapeHtml(artifactTitle)}</strong>`;
                    badge.onclick = () => openArtifactPanel(artifactTitle, artifactBody);
                    bubble.appendChild(badge);

                    // Auto open right side panel on new generation!
                    openArtifactPanel(artifactTitle, artifactBody);
                } else {
                    bubble.innerHTML = marked.parse(content);
                }
            } else {
                bubble.innerText = content;
            }

            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
            return bubble;
        }

        // --- ARTIFACT PANEL LOGIC (SMART HTML VISUAL RENDERING vs MARKDOWN) ---
        function openArtifactPanel(title, body) {
            currentArtifactTitle = title;
            currentArtifactRaw = body;

            document.getElementById('artifact-title-text').innerHTML = `<i class="fa-solid fa-file-code"></i> ${escapeHtml(title)}`;
            document.getElementById('artifact-panel').classList.add('open');
            switchArtifactTab('preview');
        }

        function closeArtifactPanel() {
            document.getElementById('artifact-panel').classList.remove('open');
        }

        function switchArtifactTab(tab) {
            const btnPreview = document.getElementById('btn-preview');
            const btnCode = document.getElementById('btn-code');
            const bodyContainer = document.getElementById('artifact-body');

            if (tab === 'preview') {
                btnPreview.classList.add('active');
                btnCode.classList.remove('active');

                const raw = currentArtifactRaw;

                // Check if artifact contains HTML code blocks (```html ... ``` or <!DOCTYPE or <div or <style)
                const hasHtmlTags = /<!DOCTYPE html|<html|<div|<style|<body|<button|<section/i.test(raw);
                const hasCodeBlock = /```(?:html|xml|css)?([\s\S]*?)```/gi.test(raw);

                if (hasHtmlTags || hasCodeBlock) {
                    // Extract code snippets inside ```html ... ``` or ```css ... ``` or raw string
                    let extractedCode = raw.replace(/```(?:html|xml|css|javascript|js)?/gi, '').replace(/```/g, '');
                    
                    // Separate CSS comments if any and build complete HTML document
                    let finalHtml = extractedCode;
                    if (!/<html/i.test(finalHtml)) {
                        finalHtml = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Inter', sans-serif; padding: 20px; background: #0f172a; color: #ffffff; }
    </style>
</head>
<body>
    ${extractedCode}
</body>
</html>`;
                    }

                    // Render in live iframe
                    const iframe = document.createElement('iframe');
                    iframe.className = 'artifact-iframe';
                    bodyContainer.innerHTML = '';
                    bodyContainer.appendChild(iframe);

                    const doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write(finalHtml);
                    doc.close();
                } else {
                    // Render formatted Markdown document
                    bodyContainer.innerHTML = marked.parse(raw);
                }
            } else {
                btnCode.classList.add('active');
                btnPreview.classList.remove('active');
                bodyContainer.innerHTML = `<pre>${escapeHtml(currentArtifactRaw)}</pre>`;
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
